<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>TeamFlow — Todo Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ====================================================================
       DESIGN TOKENS — WinUI 3 / Fluent Design
       ==================================================================== */
    :root {
      --ease-fluent: cubic-bezier(.33,1,.68,1);
      --font: "Segoe UI","Inter",system-ui,sans-serif;

      /* accent (Fluent blue-purple) */
      --accent: #7c6ee0;
      --accent-hover: #9589eb;
      --accent-press: #6358c8;
      --accent-text: #c4bbf8;

      /* timing */
      --dur: .2s;

      /* reveal size */
      --reveal-size: 180px;
    }

    [data-theme="dark"] {
      --bg: #0c0c0f;
      --surface: rgba(255,255,255,.04);
      --surface2: rgba(255,255,255,.07);
      --card: rgba(255,255,255,.055);
      --card-solid: #1a1a22;
      --card-hover: rgba(255,255,255,.08);
      --stroke: rgba(255,255,255,.09);
      --divider: rgba(255,255,255,.07);
      --text: #f0f0f4;
      --text-secondary: rgba(240,240,244,.65);
      --text-dim: rgba(240,240,244,.4);
      --text-dim2: rgba(240,240,244,.25);
      --subtle-sel: rgba(255,255,255,.06);
      --nav-bg: rgba(16,16,22,.88);
      --titlebar-bg: rgba(12,12,15,.92);
      --smoke: rgba(0,0,0,.62);
      --shadow-card: 0 2px 8px rgba(0,0,0,.55);
      --shadow-flyout: 0 8px 32px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.06);
    }

    [data-theme="dark"] select.tbx { color-scheme: light; }

    [data-theme="light"] {
      --bg: #f3f3f7;
      --surface: rgba(255,255,255,.55);
      --surface2: rgba(255,255,255,.8);
      --card: rgba(255,255,255,.72);
      --card-solid: #ffffff;
      --card-hover: rgba(255,255,255,.92);
      --stroke: rgba(0,0,0,.1);
      --divider: rgba(0,0,0,.07);
      --text: #1a1a2e;
      --text-secondary: rgba(26,26,46,.65);
      --text-dim: rgba(26,26,46,.45);
      --text-dim2: rgba(26,26,46,.3);
      --subtle-sel: rgba(0,0,0,.05);
      --nav-bg: rgba(235,235,245,.88);
      --titlebar-bg: rgba(240,240,248,.94);
      --smoke: rgba(0,0,0,.32);
      --shadow-card: 0 2px 8px rgba(0,0,0,.1);
      --shadow-flyout: 0 8px 28px rgba(0,0,0,.2), 0 0 0 1px rgba(0,0,0,.06);
    }

    /* ====================================================================
       RESET & BASE
       ==================================================================== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { font-size: 14px; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      min-height: 100dvh;
      overflow-x: hidden;
      padding-bottom: env(safe-area-inset-bottom);
    }
    a { color: inherit; text-decoration: none; }
    button { font-family: var(--font); cursor: pointer; border: none; background: none; }
    input, select, textarea { font-family: var(--font); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ====================================================================
       TYPOGRAPHY
       ==================================================================== */
    .t-title      { font-size: 22px; font-weight: 700; letter-spacing: -.025em; }
    .t-subtitle   { font-size: 17px; font-weight: 600; letter-spacing: -.015em; }
    .t-body-lg    { font-size: 15px; font-weight: 500; }
    .t-body-strong{ font-size: 13.5px; font-weight: 600; }
    .t-body       { font-size: 13.5px; }
    .t-caption    { font-size: 12px; }
    .dim          { color: var(--text-secondary); }
    .dim2         { color: var(--text-dim2); }
    .accent-text  { color: var(--accent); }

    /* ====================================================================
       LAYOUT HELPERS
       ==================================================================== */
    .row    { display: flex; align-items: center; flex-wrap: nowrap; }
    .col    { display: flex; flex-direction: column; }
    .wrap   { flex-wrap: wrap; }
    .spacer { flex: 1; }
    .gap4   { gap: 4px; }  .gap8  { gap: 8px; }
    .gap12  { gap: 12px; } .gap16 { gap: 16px; }
    .mt4  { margin-top: 4px; }  .mt8  { margin-top: 8px; }
    .mt12 { margin-top: 12px; } .mt16 { margin-top: 16px; }
    .hr   { height: 1px; background: var(--divider); }

    /* ====================================================================
       FLUENT REVEAL HOVER
       ==================================================================== */
    .reveal, .reveal-border { position: relative; overflow: hidden; }
    .reveal::after, .reveal-border::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      border-radius: inherit;
      background: radial-gradient(
        var(--reveal-size) circle at var(--rx, 50%) var(--ry, 50%),
        rgba(255,255,255,.12) 0%,
        transparent 70%
      );
      opacity: 0;
      transition: opacity .22s;
    }
    .reveal:hover::after        { opacity: 1; }
    .reveal-border::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      border: 1px solid transparent;
      background: radial-gradient(
        var(--reveal-size) circle at var(--rx, 50%) var(--ry, 50%),
        rgba(255,255,255,.25) 0%,
        transparent 70%
      ) border-box;
      -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: destination-out;
      mask-composite: exclude;
      opacity: 0;
      transition: opacity .22s;
      pointer-events: none;
    }
    .reveal-border:hover::before { opacity: 1; }

    /* ====================================================================
       APP CHROME
       ==================================================================== */
    .app { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }

    /* -- titlebar -- */
    .titlebar {
      display: flex; align-items: center; gap: 6px;
      height: 52px; padding: 0 12px 0 10px;
      background: var(--titlebar-bg);
      border-bottom: 1px solid var(--stroke);
      -webkit-backdrop-filter: blur(28px); backdrop-filter: blur(28px);
      position: sticky; top: 0; z-index: 30;
      flex-shrink: 0;
    }
    .brand-glyph {
      background: linear-gradient(135deg, var(--accent), var(--accent-press));
      display: grid; place-items: center;
      color: #fff; border-radius: 8px;
    }

    /* -- app body -- */
    .app-body { display: flex; flex: 1; min-height: 0; overflow: hidden; }

    /* -- nav rail -- */
    .rail {
      display: flex; flex-direction: column; justify-content: space-between;
      width: 240px; min-width: 240px;
      background: var(--nav-bg);
      -webkit-backdrop-filter: blur(28px); backdrop-filter: blur(28px);
      border-right: 1px solid var(--stroke);
      padding: 8px 6px; transition: width var(--dur) var(--ease-fluent), min-width var(--dur) var(--ease-fluent);
      overflow: hidden; flex-shrink: 0;
    }
    .app.compact .rail { width: 56px; min-width: 56px; }
    .rail-scroll { display: flex; flex-direction: column; gap: 2px; overflow-y: auto; overflow-x: hidden; }

    .nav-item {
      display: flex; align-items: center; gap: 10px;
      height: 40px; padding: 0 10px;
      border-radius: 8px; cursor: pointer; position: relative;
      color: var(--text-secondary);
      transition: color var(--dur), background var(--dur);
      white-space: nowrap; flex-shrink: 0;
    }
    .nav-item:hover { background: var(--subtle-sel); color: var(--text); }
    .nav-item.sel { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
    .nav-item.sel::before {
      content: ""; position: absolute; left: -6px; top: 50%; transform: translateY(-50%);
      width: 3px; height: 20px; border-radius: 2px; background: var(--accent);
    }
    .nav-item .ic { flex-shrink: 0; width: 22px; display: grid; place-items: center; }
    .nav-item .lbl { font-size: 13px; font-weight: 500; transition: opacity var(--dur); }
    .app.compact .nav-item .lbl { opacity: 0; pointer-events: none; }
    .badge-count {
      margin-left: auto; background: var(--accent); color: #fff;
      font-size: 10px; font-weight: 700; line-height: 1;
      padding: 2px 6px; border-radius: 10px;
    }
    .app.compact .badge-count { display: none; }

    /* -- content -- */
    .content-host { flex: 1; overflow-y: auto; min-height: 0; background: var(--bg); }
    .content-pad  { padding: 28px 28px 40px; }

    /* ====================================================================
       CARDS
       ==================================================================== */
    .card {
      background: var(--card);
      border: 1px solid var(--stroke);
      border-radius: 12px;
      -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
      box-shadow: var(--shadow-card);
    }
    .card-pad { padding: 18px; }
    .card.solid { background: var(--card-solid); -webkit-backdrop-filter: none; backdrop-filter: none; }
    .muted-box {
      background: var(--subtle-sel); border: 1px solid var(--stroke);
      border-radius: 8px; padding: 12px;
    }

    /* ====================================================================
       BUTTONS
       ==================================================================== */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      height: 34px; padding: 0 14px; border-radius: 7px;
      font-size: 13px; font-weight: 500; letter-spacing: .01em;
      background: var(--surface2); color: var(--text);
      border: 1px solid var(--stroke);
      transition: background var(--dur), opacity var(--dur), transform 80ms;
    }
    .btn:hover { background: var(--card-hover); }
    .btn:active { transform: scale(.975); }
    .btn:disabled { opacity: .45; cursor: not-allowed; pointer-events: none; }
    .btn.accent { background: var(--accent); color: #fff; border-color: transparent; }
    .btn.accent:hover { background: var(--accent-hover); }
    .btn.danger { background: rgba(196,43,28,.18); color: #e05c4b; border-color: rgba(196,43,28,.2); }
    .btn.danger:hover { background: rgba(196,43,28,.28); }
    .btn.outline { background: transparent; border-color: var(--stroke); }
    .btn.subtle  { background: transparent; border-color: transparent; color: var(--text-secondary); }
    .btn.subtle:hover { background: var(--subtle-sel); color: var(--text); }
    .btn.sm  { height: 28px; padding: 0 10px; font-size: 12px; border-radius: 6px; }
    .btn.lg  { height: 42px; padding: 0 20px; font-size: 14px; border-radius: 9px; }
    .btn.block { width: 100%; }

    /* hbtn = icon-only square button */
    .hbtn {
      position: relative; display: grid; place-items: center;
      width: 36px; height: 36px; border-radius: 7px;
      color: var(--text-secondary); overflow: hidden;
      transition: background var(--dur), color var(--dur);
    }
    .hbtn:hover { background: var(--subtle-sel); color: var(--text); }
    .hbtn .dot {
      position: absolute; top: 4px; right: 4px;
      min-width: 16px; height: 16px; padding: 0 4px;
      background: var(--accent); color: #fff;
      font-size: 9px; font-weight: 700; border-radius: 8px;
      display: grid; place-items: center;
    }

    /* ====================================================================
       TOGGLE
       ==================================================================== */
    .toggle { cursor: pointer; display: inline-flex; align-items: center; }
    .toggle .track {
      display: inline-flex; width: 40px; height: 22px; border-radius: 11px;
      background: var(--subtle-sel); border: 1.5px solid var(--stroke);
      padding: 2px; transition: background var(--dur), border-color var(--dur);
    }
    .toggle .knob {
      width: 16px; height: 16px; border-radius: 50%;
      background: var(--text-dim2); transform: translateX(0);
      transition: transform .18s var(--ease-fluent), background var(--dur);
    }
    .toggle.on .track { background: color-mix(in srgb, var(--accent) 20%, transparent); border-color: var(--accent); }
    .toggle.on .knob  { background: var(--accent); transform: translateX(18px); }

    /* ====================================================================
       FORM INPUTS
       ==================================================================== */
    .field-label { display: block; font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
    .req { color: var(--accent); }

    .tbx {
      width: 100%;
      height: 36px; padding: 0 10px;
      background: var(--surface2); color: var(--text);
      border: 1px solid var(--stroke); border-radius: 7px;
      font-size: 13px; font-family: var(--font);
      transition: border-color var(--dur), box-shadow var(--dur);
      -webkit-appearance: none; appearance: none;
    }
    textarea.tbx { height: auto; padding: 8px 10px; resize: vertical; }
    .tbx:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 22%, transparent); }
    .tbx::placeholder { color: var(--text-dim); }

    .select-wrap { position: relative; }
    .select-wrap > select.tbx { padding-right: 28px; cursor: pointer; }
    .select-wrap > svg { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--text-dim); }

    .input-icon { position: relative; }
    .input-icon > svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-dim); pointer-events: none; }
    .input-icon > input.tbx { padding-left: 32px; }

    /* ====================================================================
       AVATAR
       ==================================================================== */
    .avatar {
      border-radius: 50%; display: grid; place-items: center;
      color: #fff; font-weight: 700; flex-shrink: 0;
      text-transform: uppercase; letter-spacing: -.02em;
    }

    /* ====================================================================
       BADGES / STATUS CHIPS
       ==================================================================== */
    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600;
      white-space: nowrap;
    }
    .badge.ongoing  { color: #3fa3e8; background: rgba(63,163,232,.13); }
    .badge.done     { color: #3fcb89; background: rgba(63,203,137,.13); }
    .badge.paused   { color: #c89f0a; background: rgba(200,159,10,.13); }
    .badge.pending  { color: #c8a43a; background: rgba(200,164,58,.13); }
    .badge.rejected { color: #e0604b; background: rgba(224,96,75,.13); }
    .badge.idle     { color: var(--text-dim); background: var(--subtle-sel); }
    .badge.over     { color: #c8650a; background: rgba(200,101,10,.13); }

    /* ====================================================================
       PROGRESS BAR
       ==================================================================== */
    .pbar {
      height: 4px; background: var(--subtle-sel); border-radius: 2px; overflow: hidden;
    }
    .pbar.thick { height: 8px; border-radius: 4px; }
    .pbar > i {
      display: block; height: 100%; border-radius: inherit;
      background: var(--accent); transition: width .4s var(--ease-fluent);
    }
    .pbar > i.warn { background: #c8650a; }
    .pbar > i.full { background: #0f7b3f; }

    /* ====================================================================
       SECTION LABEL
       ==================================================================== */
    .section-label {
      display: flex; align-items: center; gap: 6px;
      font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .09em;
      color: var(--text-dim); margin: 22px 0 10px;
    }

    /* ====================================================================
       TABLE
       ==================================================================== */
    .tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
    .tbl thead th {
      padding: 10px 14px; text-align: left;
      font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
      color: var(--text-dim); border-bottom: 1px solid var(--divider);
    }
    .tbl tbody td { padding: 11px 14px; border-bottom: 1px solid var(--divider); }
    .tbl tbody tr:last-child td { border-bottom: none; }
    .tbl tbody tr:hover td { background: var(--subtle-sel); }

    /* ====================================================================
       DIALOGS & PANELS
       ==================================================================== */
    .smoke {
      position: fixed; inset: 0; z-index: 49;
      background: var(--smoke);
      -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
      animation: fadein .18s;
    }
    @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

    .dialog {
      position: fixed; top: 50%; left: 50%; z-index: 50;
      transform: translate(-50%, -50%);
      width: 480px; max-width: calc(100vw - 24px);
      background: var(--card-solid);
      border: 1px solid var(--stroke); border-radius: 14px;
      box-shadow: var(--shadow-flyout);
      overflow: hidden;
      animation: dialog-in .22s var(--ease-fluent);
    }
    @keyframes dialog-in { from { opacity: 0; transform: translate(-50%,-48%) scale(.96); } to { opacity: 1; transform: translate(-50%,-50%) scale(1); } }

    .dialog-head {
      display: flex; align-items: center; gap: 10px;
      padding: 16px 16px 12px;
      border-bottom: 1px solid var(--divider);
    }
    .dialog-body { padding: 18px; max-height: 60vh; overflow-y: auto; }
    .dialog-foot {
      display: flex; align-items: center; justify-content: flex-end; gap: 8px;
      padding: 12px 18px;
      border-top: 1px solid var(--divider);
      background: var(--surface);
    }

    .panel {
      position: fixed; top: 0; right: 0; bottom: 0; z-index: 50;
      width: 420px; max-width: 100vw;
      background: var(--card-solid);
      border-left: 1px solid var(--stroke);
      box-shadow: -8px 0 40px rgba(0,0,0,.45);
      display: flex; flex-direction: column;
      animation: panel-in .26s var(--ease-fluent);
    }
    @keyframes panel-in { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }

    .panel-head {
      display: flex; align-items: center; gap: 10px;
      padding: 16px 16px 14px;
      border-bottom: 1px solid var(--divider);
      flex-shrink: 0;
    }
    .panel-body { flex: 1; overflow-y: auto; padding: 18px; }
    .panel-foot {
      display: flex; align-items: center; justify-content: flex-end; gap: 8px;
      padding: 12px 18px;
      border-top: 1px solid var(--divider);
      background: var(--surface);
      flex-shrink: 0;
    }

    /* ====================================================================
       TOASTS
       ==================================================================== */
    .toast-host {
      position: fixed; bottom: 20px; right: 20px; z-index: 60;
      display: flex; flex-direction: column-reverse; gap: 8px;
    }
    .toast {
      display: flex; align-items: flex-start; gap: 10px;
      min-width: 280px; max-width: 340px; padding: 12px 14px;
      background: var(--card-solid); border: 1px solid var(--stroke);
      border-radius: 10px; box-shadow: var(--shadow-flyout);
      animation: toast-in .22s var(--ease-fluent);
    }
    .toast.out { animation: toast-out .28s var(--ease-fluent) forwards; }
    @keyframes toast-in  { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes toast-out { from { transform: none; opacity: 1; } to { transform: translateX(24px); opacity: 0; } }
    .toast .ti {
      width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
      display: grid; place-items: center; font-size: 11px;
    }
    .toast .ti.ok  { background: rgba(15,123,63,.2); color: #3fcb89; }
    .toast .ti.err { background: rgba(196,43,28,.2); color: #e05c4b; }
    .toast .ti.info{ background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }

    /* ====================================================================
       SPIN ANIMATION
       ==================================================================== */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { animation: spin .8s linear infinite; display: inline-block; }

    /* ====================================================================
       PAGE TRANSITION
       ==================================================================== */
    .page-enter { animation: page-in .25s var(--ease-fluent); }
    @keyframes page-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    /* ====================================================================
       LOGIN PAGE
       ==================================================================== */
    .login-stage {
      min-height: 100dvh; display: grid; place-items: center;
      background: var(--bg); padding: 20px;
    }
    .login-card {
      width: 100%; max-width: 400px;
      background: var(--card-solid); border: 1px solid var(--stroke);
      border-radius: 16px; padding: 36px 32px;
      box-shadow: var(--shadow-flyout);
    }
    .link { color: var(--accent); cursor: pointer; font-size: 13px; }
    .link:hover { text-decoration: underline; }

    /* ====================================================================
       DASHBOARD GRIDS
       ==================================================================== */
    .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
    .two-col   { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .three-col { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }

    /* ====================================================================
       BAR CHART (AnimatedBars in pages1)
       ==================================================================== */
    .bars { display: flex; align-items: flex-end; gap: 6px; height: 120px; padding: 0 4px; }
    .bcol { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; }
    .bstack { flex: 1; width: 100%; display: flex; align-items: flex-end; }
    .bfill {
      width: 100%; border-radius: 4px 4px 0 0;
      background: color-mix(in srgb, var(--accent) 45%, transparent);
      transition: height .55s var(--ease-fluent);
      min-height: 4px;
    }
    .bval  { font-size: 10px; font-weight: 600; color: var(--text-secondary); }
    .blbl  { font-size: 10px; font-weight: 600; color: var(--text-dim); }

    /* ====================================================================
       TYPOGRAPHY EXTRAS
       ==================================================================== */
    .t-title-lg { font-size: 26px; font-weight: 700; letter-spacing: -.03em; }

    /* ====================================================================
       TIMER FACE
       ==================================================================== */
    .timer-face    { font-size: 56px; font-weight: 700; letter-spacing: -.04em; font-feature-settings: "tnum"; line-height: 1; }
    .timer-face.timer-lg { font-size: 64px; }

    /* ====================================================================
       PULSE DOT (live indicator)
       ==================================================================== */
    .pulse-dot {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      background: #3fcb89; flex-shrink: 0;
      animation: pulse 1.8s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: .5; transform: scale(.7); }
    }

    /* ====================================================================
       SCROLLBAR (webkit)
       ==================================================================== */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--stroke); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }


    /* ====================================================================
       MOBILE RESPONSIVE OVERRIDES
       ==================================================================== */

    /* ---- Tablet ≤ 900px ---- */
    @media (max-width: 900px) {
      .stat-grid { grid-template-columns: repeat(2, 1fr); }
      .three-col { grid-template-columns: 1fr 1fr; }
      .rail { width: 56px; min-width: 56px; }
      .rail .nav-item .lbl { opacity: 0; pointer-events: none; }
      .app.compact .rail { width: 0; min-width: 0; border-right: none; }
    }

    /* ---- Mobile ≤ 600px ---- */
    @media (max-width: 600px) {
      /* bottom tab bar replaces left rail */
      .app-body { flex-direction: column; }

      .rail {
        position: fixed; bottom: 0; left: 0; right: 0;
        width: 100% !important; min-width: 100% !important;
        height: 56px; flex-direction: row; padding: 4px 8px;
        border-right: none; border-top: 1px solid var(--stroke);
        z-index: 20; justify-content: unset; align-items: stretch;
        padding-bottom: calc(4px + env(safe-area-inset-bottom));
        height: calc(56px + env(safe-area-inset-bottom));
      }
      .rail-scroll {
        flex-direction: row; overflow-x: auto; overflow-y: hidden;
        align-items: stretch; gap: 2px; flex: 1;
        scrollbar-width: none;
      }
      .rail-scroll::-webkit-scrollbar { display: none; }

      .rail > div:last-child { display: flex; flex-direction: row; gap: 2px; }
      .rail > div:last-child .hr { display: none; }

      .nav-item {
        flex-direction: column; height: auto; gap: 0; padding: 8px 6px;
        min-width: 52px; max-width: 72px; flex: 1;
        justify-content: center; border-radius: 10px;
      }
      /* icon-only: hide label entirely on mobile */
      .nav-item .lbl { display: none !important; }
      .nav-item .ic  { width: 22px; }
      .nav-item::before { display: none !important; }
      .nav-item.sel { background: color-mix(in srgb, var(--accent) 14%, transparent); }

      .badge-count { display: inline-flex !important; font-size: 9px; padding: 1px 4px; }

      .content-host {
        margin-bottom: calc(56px + env(safe-area-inset-bottom));
      }
      .content-pad { padding: 16px 14px 24px; }

      /* compact rail toggle hidden — not needed with bottom bar */
      .titlebar .hbtn:first-child { display: none; }

      /* stat grid 2-col on small mobile */
      .stat-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .two-col   { grid-template-columns: 1fr; }
      .three-col { grid-template-columns: 1fr; }

      /* timer face smaller */
      .timer-face { font-size: 40px; }

      /* dialogs → bottom sheet */
      .dialog {
        width: 100vw !important; max-width: 100vw !important;
        top: auto !important; bottom: 0 !important;
        left: 0 !important; right: 0 !important;
        transform: none !important;
        border-radius: 16px 16px 0 0;
        animation: dialog-up .28s var(--ease-fluent);
        max-height: 90dvh;
      }
      @keyframes dialog-up {
        from { transform: translateY(30px); opacity: 0; }
        to   { transform: none; opacity: 1; }
      }
      .dialog-body { max-height: 60dvh; }

      /* panels → full-height bottom sheet */
      .panel {
        top: auto; height: 92dvh; left: 0; right: 0;
        width: 100% !important; max-width: 100% !important;
        border-left: none; border-top: 1px solid var(--stroke);
        border-radius: 14px 14px 0 0;
        animation: panel-up .3s var(--ease-fluent);
      }
      @keyframes panel-up {
        from { transform: translateY(30px); opacity: 0; }
        to   { transform: none; opacity: 1; }
      }

      /* toasts bottom-left so they don't overlap bottom tab bar */
      .toast-host {
        bottom: calc(68px + env(safe-area-inset-bottom));
        right: 10px; left: 10px;
      }
      .toast { min-width: 0; max-width: none; width: 100%; }

      /* hide non-essential columns in tables */
      .tbl .hide-mobile { display: none; }

      /* login */
      .login-stage { padding: 20px; }
      .login-card  { padding: 28px 20px; }

      /* bar chart */
      .bar-chart { height: 90px; }
    }

    /* ---- Extra-small ≤ 380px ---- */
    @media (max-width: 380px) {
      .stat-grid { grid-template-columns: 1fr; }
      .t-title { font-size: 18px; }
      .timer-face { font-size: 34px; }
    }

    /* ---- Ensure touch-friendly tap targets ---- */
    @media (hover: none), (max-width: 600px) {
      .btn  { min-height: 44px; }
      .hbtn { min-width: 44px; min-height: 44px; }
      .nav-item { min-height: 44px; }
      .tbx  { min-height: 44px; }
      .toggle .track { width: 46px; height: 26px; }
      .toggle .knob  { width: 20px; height: 20px; }
      .toggle.on .knob { transform: translateX(20px); }
    }

    /* ---- Utility: hide classes ---- */
    @media (max-width: 600px) {
      .hide-mobile { display: none !important; }
    }
    @media (max-width: 480px) {
      .hide-mobile-sm { display: none !important; }
    }
  </style>
</head>

  <script type="text/babel" src="icons.jsx"></script>
